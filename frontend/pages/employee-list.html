<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employees — Emporer</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/employee-list.css"
    >
</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            EMPORER<span>.</span>
        </div>

        <nav>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/employee-list">
                Employees
            </a>

            <a href="/employees/me">
                My Profile
            </a>

        </nav>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </aside>


    <main class="dashboard-main">

        <header class="dashboard-header">

            <div>

                <p class="eyebrow">
                    COMPANY MANAGEMENT
                </p>

                <h1>
                    Employees
                </h1>

            </div>

            <div
                class="user-badge"
                id="userName"
            >
                Loading...
            </div>

        </header>


        <section class="employee-list-header">

            <div>

                <p class="eyebrow">
                    EMPLOYEE DIRECTORY
                </p>

                <h2>
                    All Employees
                </h2>

                <p class="employee-subtitle">
                    View employee records available to your role.
                </p>

            </div>

            <button
                id="refreshEmployees"
                class="refresh-button"
            >
                Refresh
            </button>

        </section>


        <section class="employee-list-card">

            <div class="table-top">

                <div>

                    <span class="table-label">
                        TOTAL EMPLOYEES
                    </span>

                    <strong id="employeeCount">
                        0
                    </strong>

                </div>

                <div
                    id="employeeMessage"
                    class="employee-message"
                ></div>

            </div>


            <div class="table-wrapper">

                <table class="employee-table">

                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>NAME</th>
                            <th>EMAIL</th>
                            <th>SALARY</th>
                            <th>DEPARTMENT</th>
                            <th>ACTIONS</th>
                        </tr>

                    </thead>

                    <tbody id="employeeTableBody">

                        <tr>
                            <td
                                colspan="6"
                                class="table-loading"
                            >
                                Loading employees...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>


<script src="/static/js/routeGuard.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/employee-list.js"></script>

</body>

</html>
