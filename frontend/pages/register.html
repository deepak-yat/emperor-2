<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Registration</h1>

        <form id="registerForm">

            <div>
                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    required
                >
            </div>

            <br>

            <div>
                <label for="email">
                    Employee Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >
            </div>

            <br>

            <div>
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >
            </div>

            <br>

            <button type="submit">
                Register
            </button>

        </form>

        <p id="message"></p>

        <a href="/login">
            Already have an account? Login
        </a>

    </div>

    <script src="/static/js/auth.js"></script>

</body>

</html>
