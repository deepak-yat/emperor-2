<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — Emporer</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/static/css/auth.css"
    >
</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-header">

                <a href="/" class="auth-logo">
                    EMPORER<span>.</span>
                </a>

                <p>EMPLOYEE REGISTRATION</p>

            </div>


            <div class="auth-content">

                <h1>Create account.</h1>

                <p class="auth-subtitle">
                    Use the email assigned to you as an employee.
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="username">
                            USERNAME
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            EMPLOYEE EMAIL
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your company email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            PASSWORD
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            CONFIRM PASSWORD
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                        id="registerButton"
                    >
                        <span id="registerButtonText">
                            CREATE ACCOUNT
                        </span>
                    </button>


                    <p
                        id="registerMessage"
                        class="auth-message"
                    ></p>

                </form>


                <div class="auth-footer">

                    <span>
                        Already have an account?
                    </span>

                    <a href="/login">
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>


    <script src="/static/js/auth.js"></script>

</body>

</html>
